<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algebraic Physics Placement Diagnostic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centred lab-notebook column on faint graph paper; one card per screen. */
:root {
  --bg: #eef2f6; --grid: #dfe6ee; --card: #ffffff; --ink: #15202b; --muted: #586776; --line: #d3dbe4;
  --accent: #1b5ea6; --accent-ink: #ffffff; --accent-soft: #e2ecf7; --field: #ffffff;
  --good: #11672c; --good-bg: #e1f1e5; --warn: #8f4a00; --warn-bg: #fbeedb; --bad: #b4231f; --bad-bg: #fae3e2;
  --grey-bg: #e9edf2;
  --f-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, Menlo, monospace;
  --f-math: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111821; --grid: #18212c; --card: #19222d; --ink: #e8edf2; --muted: #9eabb8; --line: #2e3a47;
    --accent: #6fa9e8; --accent-ink: #0d1520; --accent-soft: #1d2f45; --field: #111821;
    --good: #82d39a; --good-bg: #183324; --warn: #f0b46e; --warn-bg: #3a2b17; --bad: #ff9590; --bad-bg: #3d1f1f;
    --grey-bg: #222c38; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111821; --grid: #18212c; --card: #19222d; --ink: #e8edf2; --muted: #9eabb8; --line: #2e3a47;
  --accent: #6fa9e8; --accent-ink: #0d1520; --accent-soft: #1d2f45; --field: #111821;
  --good: #82d39a; --good-bg: #183324; --warn: #f0b46e; --warn-bg: #3a2b17; --bad: #ff9590; --bad-bg: #3d1f1f;
  --grey-bg: #222c38; color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0; color: var(--ink); font-family: var(--f-body); line-height: 1.55;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
#app { max-width: 800px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 26px clamp(18px, 4vw, 32px); margin-bottom: 18px; min-width: 0; }
h1, h2 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 800; margin: 0 0 6px; }
h2 { font-size: 1.12rem; font-weight: 700; margin: 26px 0 8px; }
.eyebrow { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 14px; }
ul.rules, ol.rules { padding-left: 1.2em; margin: 8px 0; display: grid; gap: 6px; }
label { display: block; font-weight: 600; margin: 14px 0 4px; }
input[type=text] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); }
input:focus, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.answer-row { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; background: var(--field); overflow: hidden; }
.answer-row:focus-within { outline: 3px solid var(--accent); outline-offset: 1px; }
.answer-row input { border: none; border-radius: 0; font-family: var(--f-mono); font-size: 1.15rem; padding: 12px 14px; min-width: 0; flex: 1; }
.answer-row input:focus { outline: none; }
.unit { display: flex; align-items: center; padding: 0 14px; font-family: var(--f-mono); font-size: 1rem; color: var(--muted); background: var(--grey-bg); border-left: 1px solid var(--line); white-space: nowrap; }
.unit.lead-in { border-left: none; border-right: 1px solid var(--line); font-family: var(--f-math); font-size: 1.15rem; color: var(--ink); }
button, a.btn { font: inherit; cursor: pointer; border-radius: 8px; padding: 10px 18px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; display: inline-block; }
button.primary, a.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button.quiet { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.qhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; color: var(--muted); font-size: .92rem; margin-bottom: 12px; flex-wrap: wrap; }
.qhead .where { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .05em; text-transform: uppercase; }
.timer { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.low { color: var(--warn); }
.prompt { font-size: 1.2rem; margin: 4px 0 18px; }
.prompt p { margin: 0 0 .6em; }
.hint { color: var(--muted); font-size: .92rem; margin: 8px 0; }
.opts { display: grid; gap: 8px; margin: 6px 0 12px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; width: 100%; }
.opt .key { font-family: var(--f-mono); font-weight: 600; color: var(--accent); min-width: 1.2em; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.preview { min-height: 2.6em; margin: 10px 0 6px; padding: 8px 12px; border-radius: 8px; background: var(--grey-bg); display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.preview .lead { color: var(--muted); font-size: .9rem; }
.preview .val { font-family: var(--f-mono); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
.keys button { padding: 5px 12px; min-width: 2.6em; font-family: var(--f-math); font-size: 1.05rem; }
.keys button.op { font-family: var(--f-mono); font-size: .9rem; color: var(--muted); }
.math { font-family: var(--f-math); font-size: 1.2rem; line-height: 1.2; }
.math i { font-style: italic; }
.math.units i { font-style: normal; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; }
.frac > span { padding: 0 3px; }
.frac > span:first-child { border-bottom: 1.5px solid currentColor; }
.rad { white-space: nowrap; }
.rad > span { display: inline-block; border-top: 1.5px solid currentColor; padding: .12em 2px 0; margin-left: 1px; line-height: 1.25; }
.math sup { line-height: 0; }
.mj { display: inline-flex; align-items: center; font-size: 1.2rem; }
.mj mjx-container { margin: 0 !important; }
.vecprev { display: inline-flex; align-items: center; gap: 2px; font-family: var(--f-math); font-size: 1.2rem; }
.math sup { font-size: .7em; }
.msg { min-height: 1.4em; margin: 6px 0 10px; }
.msg.warn { color: var(--warn); }
.msg.err { color: var(--bad); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .84rem; font-weight: 700; white-space: nowrap; }
.chip.l4, .chip.l3, .chip.right { background: var(--good-bg); color: var(--good); }
.chip.l2, .chip.tag { background: var(--accent-soft); color: var(--accent); }
.chip.l1, .chip.skipped { background: var(--warn-bg); color: var(--warn); }
.chip.l0, .chip.wrong { background: var(--bad-bg); color: var(--bad); }
.chip.nt { background: var(--grey-bg); color: var(--muted); }
.ladder { font-family: var(--f-mono); white-space: nowrap; letter-spacing: .1em; }
.band { display: grid; gap: 4px; padding: 16px 18px; border-radius: 10px; background: var(--accent-soft); margin: 12px 0; }
.band .name { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; color: var(--accent); }
.meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
.meter span { height: 8px; border-radius: 4px; background: var(--line); }
.meter span.on { background: var(--accent); }
.meter-labels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: .74rem; color: var(--muted); }
.small { font-size: .88rem; color: var(--muted); }
.demo td:first-child { font-family: var(--f-mono); white-space: nowrap; }
.findings { display: grid; gap: 10px; padding: 0; margin: 8px 0; list-style: none; }
.findings li { padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--grey-bg); border-radius: 0 8px 8px 0; }
.findings li b { display: block; }
textarea.copybox { width: 100%; height: 8em; font-family: var(--f-mono); font-size: .8rem; background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.addr { font-family: var(--f-mono); user-select: all; }
@media (prefers-reduced-motion: no-preference) { .card { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }
</style>
</head>

<script id="diag-core">
/* Algebra-based physics diagnostic: bank, graders and adaptive engine (pure, no DOM). */
var PhysDiag = (function () {
  'use strict';

  var CHAPTERS = [
    [1, 'Math Skills'], [2, 'Unit Calculations'], [3, 'Motion in One Dimension'], [4, 'Vectors and Projectiles'], [5, 'Newton\'s Laws'],
    [6, 'Work, Energy and Power'], [7, 'Momentum'], [8, 'Circular Motion and Gravity'], [9, 'Fluids and Pressure'],
    [10, 'Heat and Temperature'], [11, 'Waves and Sound'], [12, 'Light and Optics'], [13, 'Electric Charge and Field'],
    [14, 'Circuits'], [15, 'Magnetism and Induction'], [16, 'Modern and Nuclear Physics']
  ];
  var SETTINGS = { title: 'Algebraic Physics Placement Diagnostic', seconds_per_item: 180, max_items: 75, tolerance: 0.01,
                   sym_every: 3, email_to: 'textbookbreakdown@gmail.com', subject_tag: '[PHYS-ALG-DIAG]', skool_dm_url: 'https://www.skool.com/chat' };

  function mc(ch, rung, v, q, right, wrong) { return { ch: ch, rung: rung, v: v, type: 'mc', q: q, opts: [right].concat(wrong) }; }
  function num(ch, rung, v, q, ans, unit) { return { ch: ch, rung: rung, v: v, type: 'num', q: q, ans: ans, unit: unit || '' }; }
  function sym(ch, rung, q, lhs, vars, key, ranges) { return { ch: ch, rung: rung, v: 'S', type: 'sym', q: q, lhs: lhs, vars: vars, key: key, ranges: ranges || {} }; }
  // A units answer: the student types units (kg m/s^2, J, N/m^2 ...); graded by dimensions, so any equivalent form counts.
  var UNIT_VARS = ['kg', 'm', 's', 'A', 'K', 'N', 'J', 'W', 'Pa', 'C', 'V', 'Hz'];
  function unit(ch, rung, q, lhs, key) { return { ch: ch, rung: rung, v: 'U', type: 'unit', q: q, lhs: lhs, vars: UNIT_VARS, keys: ['kg', 'm', 's', 'N', 'J'], key: key, ranges: {} }; }
  var G = 10;

  var ITEMS = [
    // ==== 1 Math Skills
    mc(1, 1, 'A', 'Which of these equals 5 × 10⁻³?', '0.005', ['0.0005', '0.05', '5000']),
    mc(1, 1, 'B', 'How is 3.2 × 10⁴ written as an ordinary number?', '32,000', ['3,200', '320,000', '0.00032']),
    num(1, 2, 'A', 'Solve 3x + 5 = 20 for x.', (20 - 5) / 3, ''),
    num(1, 2, 'B', 'A right triangle has legs of 5 and 12. How long is the hypotenuse?', Math.sqrt(5 * 5 + 12 * 12), ''),
    sym(1, 2, 'Solve d = v·t for t.', 't', ['d', 'v'], 'd/v'),
    num(1, 3, 'A', 'In a right triangle, sin θ = 0.6. What is cos θ?', Math.sqrt(1 - 0.6 * 0.6), ''),
    num(1, 3, 'B', 'Work out (4 × 10⁶) × (3 × 10⁻²) ÷ (2 × 10³).', 4e6 * 3e-2 / 2e3, ''),
    sym(1, 3, 'Solve x = ½·a·t² for t.', 't', ['x', 'a'], 'sqrt(2*x/a)'),
    num(1, 4, 'A', 'y = k/x². When x is doubled, by what factor is y multiplied? (You can type a fraction like 1/3.)', 1 / 4, ''),
    num(1, 4, 'B', 'The radius of a circle is tripled. By what factor does its area increase?', 9, 'times'),
    sym(1, 4, 'The period of a pendulum is T = 2π√(L/g). Solve for g.', 'g', ['T', 'L'], '4*pi^2*L/T^2'),

    // ==== 2 Unit Calculations
    mc(2, 1, 'A', 'Which of these is the same as 1 newton?', '1 kg·m/s²', ['1 kg·m/s', '1 kg·m²/s²', '1 kg/(m·s²)']),
    mc(2, 1, 'B', 'One pascal, the unit of pressure, is the same as:', '1 N/m²', ['1 N·m', '1 N/m', '1 J/s']),
    num(2, 2, 'A', 'Convert 54 km/h to metres per second.', 54 * 1000 / 3600, 'm/s'),
    num(2, 2, 'B', 'Convert 450 g to kilograms.', 450 / 1000, 'kg'),
    unit(2, 2, 'Force is mass × acceleration. What is the SI unit of force, written in base units (kg, m, s)?', 'unit of F', 'kg*m/s^2'),
    num(2, 3, 'A', 'Convert a density of 2.7 g/cm³ to kg/m³.', 2.7 * 1000, 'kg/m³'),
    num(2, 3, 'B', 'Convert 1 kWh to joules. (You can type an answer like 2e6.)', 1000 * 3600, 'J'),
    unit(2, 3, 'Kinetic energy is ½mv². What are its SI units, written in base units?', 'unit of E', 'kg*m^2/s^2'),
    num(2, 4, 'A', 'A floor has an area of 3 m². What is its area in cm²? (You can type an answer like 2e4.)', 3 * 100 * 100, 'cm²'),
    num(2, 4, 'B', 'A tap delivers 3 litres every second. How many cubic metres is that per hour? (1 m³ = 1000 L)', 3 * 3600 / 1000, 'm³/h'),
    unit(2, 4, 'In F = G·m₁·m₂/r², what are the SI units of G, written in base units?', 'unit of G', 'm^3/(kg*s^2)'),

    // ==== 3 Motion in One Dimension
    mc(3, 1, 'A', 'Which of these is a vector quantity?', 'Displacement', ['Distance', 'Speed', 'Time']),
    mc(3, 1, 'B', 'An object moves with constant velocity. What is its acceleration?', 'Zero', ['Equal to its velocity', '9.8 m/s²', 'Increasing steadily']),
    num(3, 2, 'A', 'A car travels 150 m in 6 s at a constant speed. What is its speed?', 150 / 6, 'm/s'),
    num(3, 2, 'B', 'A bicycle speeds up from 4 m/s to 16 m/s in 3 s. What is its acceleration?', (16 - 4) / 3, 'm/s²'),
    sym(3, 2, 'Solve v = v₀ + a·t for a.', 'a', ['v', 'v0', 't'], '(v-v0)/t'),
    num(3, 3, 'A', 'A car starts from rest and accelerates uniformly at 3 m/s² for 8 s. How far does it travel in that time?', 0.5 * 3 * 8 * 8, 'm'),
    num(3, 3, 'B', 'A stone is dropped from rest from the top of a building and hits the ground 3 s later. Take g = 10 m/s². How tall is the building?', 0.5 * G * 3 * 3, 'm'),
    sym(3, 3, 'An object starts from rest and speeds up with constant acceleration a. How fast is it moving after it has travelled a distance d?', 'v', ['a', 'd'], 'sqrt(2*a*d)'),
    num(3, 4, 'A', 'A train moving at 20 m/s brakes with a uniform deceleration and stops after travelling 100 m. How long does it take to stop?', 20 / ((20 * 20) / (2 * 100)), 's'),
    num(3, 4, 'B', 'A ball is thrown straight up at 30 m/s and caught again at the same height. Take g = 10 m/s². What total distance does the ball travel?', 2 * (30 * 30) / (2 * G), 'm'),
    sym(3, 4, 'A rock is thrown straight down at speed v₀ from the top of a cliff of height h. Ignore air resistance and use g for the acceleration due to gravity. How fast is it moving when it hits the ground?', 'v', ['v0', 'h', 'g'], 'sqrt(v0^2+2*g*h)'),

    // ==== 4 Vectors and Projectiles
    mc(4, 1, 'A', 'A ball rolls off a table. Ignoring air resistance, what happens to its horizontal velocity while it falls?', 'It stays the same', ['It increases', 'It decreases', 'It drops to zero']),
    mc(4, 1, 'B', 'Forces of 3 N and 4 N act on an object at right angles to each other. How big is their resultant?', '5 N', ['7 N', '1 N', '12 N']),
    num(4, 2, 'A', 'A person walks 6 m east and then 8 m north. How big is their displacement?', Math.sqrt(6 * 6 + 8 * 8), 'm'),
    num(4, 2, 'B', 'A velocity of 20 m/s points 30° above the horizontal. Use sin 30° = 0.5. What is its vertical component?', 20 * 0.5, 'm/s'),
    sym(4, 2, 'A velocity of size v points at angle θ above the horizontal. What is its horizontal component?', 'vₓ', ['v', 'theta'], 'v*cos(theta)'),
    num(4, 3, 'A', 'A ball rolls off a table 0.8 m high. Take g = 10 m/s². How long does it take to reach the floor?', Math.sqrt(2 * 0.8 / G), 's'),
    num(4, 3, 'B', 'A stone is thrown horizontally at 15 m/s from the top of a cliff 20 m high. Take g = 10 m/s². How far from the base of the cliff does it land?', 15 * Math.sqrt(2 * 20 / G), 'm'),
    sym(4, 3, 'A ball is thrown horizontally at speed u from a height h. Ignore air resistance and use g. How far does it travel horizontally before it hits the ground?', 'x', ['u', 'h', 'g'], 'u*sqrt(2*h/g)'),
    num(4, 4, 'A', 'A ball is kicked at 20 m/s at 30° above level ground. Use sin 30° = 0.5 and g = 10 m/s². How long is it in the air?', 2 * 20 * 0.5 / G, 's'),
    num(4, 4, 'B', 'A ball is launched at 50 m/s at 37° above level ground. Use sin 37° = 0.6, cos 37° = 0.8 and g = 10 m/s². How far away does it land?', (50 * 0.8) * (2 * 50 * 0.6 / G), 'm'),
    sym(4, 4, 'A ball is launched from level ground at speed v and angle θ above the horizontal. Ignore air resistance and use g. What is the greatest height it reaches?', 'H', ['v', 'theta', 'g'], '(v*sin(theta))^2/(2*g)'),

    // ==== 5 Newton's Laws
    mc(5, 1, 'A', 'The tendency of an object to stay at rest, or to keep moving in a straight line at constant speed, is called:', 'Inertia', ['Momentum', 'Friction', 'Impulse']),
    mc(5, 1, 'B', 'A book rests on a table. By Newton\'s third law, what is the reaction to the Earth pulling down on the book?', 'The book pulling up on the Earth', ['The table pushing up on the book', 'Friction between the book and the table', 'The weight of the table']),
    num(5, 2, 'A', 'A net force of 20 N acts on a 4 kg mass. What is its acceleration?', 20 / 4, 'm/s²'),
    num(5, 2, 'B', 'What is the weight of a 6 kg mass? Take g = 10 m/s².', 6 * G, 'N'),
    sym(5, 2, 'Solve F = m·a for m.', 'm', ['F', 'a'], 'F/a'),
    num(5, 3, 'A', 'A 2000 kg car moving at 15 m/s is brought to rest in 5 s. What is the size of the average braking force?', 2000 * (15 / 5), 'N'),
    num(5, 3, 'B', 'A 10 kg box on a level floor is pulled by a horizontal force of 50 N. The friction force on it is 20 N. What is its acceleration?', (50 - 20) / 10, 'm/s²'),
    sym(5, 3, 'A box of mass m is pulled across a level floor by a horizontal force F. The coefficient of kinetic friction is μ. Use g. What is the box\'s acceleration?', 'a', ['F', 'm', 'mu', 'g'], '(F-mu*m*g)/m'),
    num(5, 4, 'A', 'Blocks of 3 kg and 2 kg sit side by side, touching, on a frictionless floor. A 20 N horizontal force pushes the 3 kg block, which pushes the 2 kg block. What force does the 3 kg block exert on the 2 kg block?', 2 * (20 / (3 + 2)), 'N'),
    num(5, 4, 'B', 'A 60 kg person stands on a scale in an elevator (lift) that is accelerating upward at 2 m/s². Take g = 10 m/s². What does the scale read?', 60 * (G + 2), 'N'),
    sym(5, 4, 'Masses m₁ and m₂ (m₂ is heavier) hang on either side of a light rope over a frictionless pulley. Use g. What is the size of their acceleration?', 'a', ['m1', 'm2', 'g'], '(m2-m1)*g/(m1+m2)'),

    // ==== 6 Work, Energy and Power
    mc(6, 1, 'A', 'What is the SI unit of power?', 'Watt', ['Joule', 'Newton', 'Pascal']),
    mc(6, 1, 'B', 'As a ball falls freely, its gravitational potential energy changes mainly into:', 'Kinetic energy', ['Heat energy', 'Sound energy', 'Chemical energy']),
    num(6, 2, 'A', 'A force of 25 N moves a box 4 m in the direction of the force. How much work is done?', 25 * 4, 'J'),
    num(6, 2, 'B', 'What is the kinetic energy of a 2 kg ball moving at 6 m/s?', 0.5 * 2 * 6 * 6, 'J'),
    sym(6, 2, 'Solve P = W/t for W.', 'W', ['P', 't'], 'P*t'),
    num(6, 3, 'A', 'A 50 kg student climbs stairs 6 m high in 10 s. Take g = 10 m/s². What is the student\'s power?', (50 * G * 6) / 10, 'W'),
    num(6, 3, 'B', 'A 2 kg stone is dropped from a height of 20 m. Ignore air resistance and take g = 10 m/s². How fast is it moving just before it hits the ground?', Math.sqrt(2 * G * 20), 'm/s'),
    sym(6, 3, 'Solve E = ½·m·v² for v.', 'v', ['E', 'm'], 'sqrt(2*E/m)'),

  // ---------------------------------------------------------- number reader
  function readNumber(raw) {
    var s = String(raw || '').trim();
    if (!s) { return { error: 'Your answer appears here as you type.' }; }
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) { s = s.replace(/,/g, ''); }
    s = s.replace(/\s+/g, '').replace(/[×xX]/g, '*').replace(/[−–]/g, '-').replace(/,/g, '.');
    if (/[a-df-zA-DF-Z]/.test(s.replace(/\d(?:\.\d*)?e[-+]?\d/gi, ''))) { return { error: 'Type the number only. The unit is already shown next to the box.' }; }
    var i = 0;
    function peek() { return s[i]; }
    function numberLit() {
      var m = /^(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i.exec(s.slice(i));
      if (!m) { throw new Error('bad'); }
      i += m[0].length; return parseFloat(m[0]);
    }
    function atom() {
      if (peek() === '(') { i++; var v = expr(); if (peek() !== ')') { throw new Error('bad'); } i++; return v; }
      if (peek() === '-') { i++; return -atom(); }
      if (peek() === '+') { i++; return atom(); }
      return numberLit();
    }
    function power() { var b = atom(); if (peek() === '^') { i++; return Math.pow(b, power()); } return b; }
    function term() {
      var v = power();
      while (peek() === '*' || peek() === '/') { var op = s[i++]; var r = power(); v = op === '*' ? v * r : v / r; }
      return v;
    }
    function expr() {
      var v = term();
      while (peek() === '+' || peek() === '-') { var op = s[i++]; var r = term(); v = op === '+' ? v + r : v - r; }
      return v;
    }
    try {
      var val = expr();
      if (i !== s.length || !isFinite(val)) { throw new Error('bad'); }
      return { value: val };
    } catch (e) { return { error: 'That is not a number we can read. Try a form like 0.25, 1/4, 2.5e8 or 3x10^8.' }; }
  }
  function fmt(v) {
    if (v === 0) { return '0'; }
    var a = Math.abs(v);
    if (a >= 1e6 || a < 1e-3) {
      var e = Math.floor(Math.log10(a)), m = v / Math.pow(10, e);
      m = parseFloat(m.toPrecision(6));
      if (Math.abs(m) >= 10) { m /= 10; e += 1; }
      return m + ' × 10' + String(e).split('').map(function (c) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(c)] || (c === '-' ? '⁻' : c); }).join('');
    }
    return String(parseFloat(v.toPrecision(8)));
  }

  // ---------------------------------------------------------- expression reader (answers in letters)
  var FUNCS = ['sqrt', 'sin', 'cos', 'tan'];
  var DISPLAY = { theta: 'θ', mu: 'μ', rho: 'ρ', lambda: 'λ', pi: 'π', dT: 'ΔT', 'do': 'dₒ', di: 'dᵢ', Np: 'Nₚ', Ns: 'Nₛ', Vp: 'Vₚ', Vs: 'Vₛ' };
  var SUBDIGITS = '₀₁₂₃₄₅₆₇₈₉';
  function showVar(n) {
    if (DISPLAY[n]) { return DISPLAY[n]; }
    return n.replace(/\d+$/, function (d) { return d.split('').map(function (c) { return SUBDIGITS[+c]; }).join(''); });
  }
  function normalize(raw) {
    return String(raw || '')
      .replace(/[−–—]/g, '-').replace(/[×·∙⋅]/g, '*').replace(/÷/g, '/').replace(/\*\*/g, '^')
      .replace(/²/g, '^2').replace(/³/g, '^3').replace(/√/g, 'sqrt')
      .replace(/[₀-₉]/g, function (c) { return String(c.charCodeAt(0) - 0x2080); })
      .replace(/ₒ/g, 'o').replace(/ᵢ/g, 'i').replace(/ₚ/g, 'p').replace(/ₛ/g, 's')
      .replace(/θ/g, 'theta').replace(/[μµ]/g, 'mu').replace(/ρ/g, 'rho').replace(/λ/g, 'lambda').replace(/π/g, 'pi').replace(/Δ/g, 'd')

if (typeof module === 'object' && module.exports) { module.exports = PhysDiag; }
</script>

<script>
/* The page the student sees: start screen, one question at a time, and the report. */
(function () {
  'use strict';
  if (typeof document === 'undefined') { return; }
  var P = PhysDiag, S = P.SETTINGS, app = document.getElementById('app');
  var byId = {}; P.ITEMS.forEach(function (i) { byId[i.id] = i; });
  var chTitle = {}; P.CHAPTERS.forEach(function (c) { chTitle[c[0]] = c[1]; });
  var LIMIT = S.seconds_per_item;
  var student = { name: '' }, engine = null, log = [], examStart = 0, examActive = false, cur = null;

  function el(tag, attrs) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'class') { node.className = attrs[k]; }
      else if (k === 'text') { node.textContent = attrs[k]; }
      else if (k === 'html') { node.innerHTML = attrs[k]; }
      else if (k.slice(0, 2) === 'on') { node.addEventListener(k.slice(2), attrs[k]); }
      else { node.setAttribute(k, attrs[k]); }
    });
    function add(kid) {
      if (kid === null || kid === undefined) { return; }
      if (Array.isArray(kid)) { kid.forEach(add); return; }
      node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    for (var i = 2; i < arguments.length; i++) { add(arguments[i]); }
    return node;
  }
  function clear(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function clock(s) { return Math.floor(s / 60) + ':' + pad(s % 60); }
  function chip(kind, label) { return el('span', { class: 'chip ' + kind, text: label }); }
  function fmtDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  var blurs = 0, lastBlur = 0;
  window.addEventListener('blur', function () {
    var now = Date.now();
    if (!examActive || now - lastBlur < 1000) { return; }
    lastBlur = now; blurs++;
  });

  function preview(box, raw) {
    clear(box);
    var r = P.readNumber(raw);
    if (r.error) { box.appendChild(el('span', { class: 'lead', text: r.error })); return; }
    box.appendChild(el('span', { class: 'lead', text: 'We read your answer as:' }));
    box.appendChild(el('span', { class: 'val', text: P.fmt(r.value) }));
  }
  // Typeset an expression with MathJax (SVG) when it has loaded; otherwise use the plain HTML rendering.
  function mathNode(ast, units) {
    var mj = window.MathJax;
    if (mj && typeof mj.tex2svg === 'function') {
      try {
        if (!mathNode.styled && typeof mj.svgStylesheet === 'function') { document.head.appendChild(mj.svgStylesheet()); mathNode.styled = true; }
        var span = el('span', { class: 'mj' });
        span.appendChild(mj.tex2svg('\\displaystyle ' + P.renderTex(ast, units), { display: false }));
        return span;
      } catch (e) { /* fall through to HTML */ }
    }
    return el('span', { class: 'math' + (units ? ' units' : ''), html: P.renderAst(ast) });
  }
  function previewSym(box, raw, vars, units) {
    clear(box);
    var r = P.parseExpr(raw, vars);
    if (r.error) { box.appendChild(el('span', { class: 'lead', text: r.error })); return; }
    box.appendChild(el('span', { class: 'lead', text: 'We read your answer as:' }));
    box.appendChild(mathNode(r.ast, units));
  }
  function insertAt(input, text, back) {
    var v = input.value;
    var a = typeof input.selectionStart === 'number' ? input.selectionStart : v.length;
    var b = typeof input.selectionEnd === 'number' ? input.selectionEnd : v.length;
    input.value = v.slice(0, a) + text + v.slice(b);
    var p = a + text.length - (back || 0);
    input.focus(); input.setSelectionRange(p, p);
    input.dispatchEvent(new Event('input'));
  }
  function symKeys(input, vars, units) {
    var b = vars.map(function (v) {
      return el('button', { type: 'button', title: 'Type ' + v, onclick: function () { insertAt(input, v + (units ? ' ' : '')); } }, P.showVar(v));
    });
    var ops = units ? [['/', '/', 0], ['²', '^2', 0], ['³', '^3', 0], ['( )', '()', 1]]
                    : [['√( )', 'sqrt()', 1], ['x²', '^2', 0], ['^', '^', 0], ['( )', '()', 1], ['π', 'pi', 0]];
    return el('div', { class: 'keys', 'aria-label': 'Insert letters and symbols' }, b,
      ops.map(function (o) { return el('button', { type: 'button', class: 'op', onclick: function () { insertAt(input, o[1], o[2]); } }, o[0]); }));
  }
  function typingHint(vars) {
    var odd = vars.filter(function (v) { return P.showVar(v) !== v; });
    var parts = odd.map(function (v) { return P.showVar(v) + ' as ' + v; });
    return 'Answer with the letters on the buttons.' + (parts.length ? ' Type ' + parts.join(', ') + '.' : '');
  }

  // ------------------------------------------------------------ start screen
  function showStart() {
    clear(app);
    var demoIn = el('input', { type: 'text', id: 'demo', autocomplete: 'off', spellcheck: 'false', placeholder: '2.5e8' });
    var demoOut = el('div', { class: 'preview', 'aria-live': 'polite' });
    demoIn.addEventListener('input', function () { preview(demoOut, demoIn.value); });
    preview(demoOut, '');
    var demoVars = ['m', 'g', 'h', 'v'];
    var symIn = el('input', { type: 'text', id: 'demo-sym', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'sqrt(2gh)' });
    var symOut = el('div', { class: 'preview', 'aria-live': 'polite' });
    symIn.addEventListener('input', function () { previewSym(symOut, symIn.value, demoVars); });
    previewSym(symOut, '', demoVars);
    var nameIn = el('input', { type: 'text', id: 'name', autocomplete: 'off' });
    var err = el('div', { class: 'msg err' });

    app.appendChild(el('div', { class: 'card' },
      el('h1', { text: S.title }),
      el('ul', { class: 'rules' },
        el('li', { text: 'Use pencil and paper. No calculator, AI, internet or books.' }),
        el('li', { text: 'You have 3 minutes per question.' }),
        el('li', { text: 'If you are stuck, press "I don\'t know".' }),
        el('li', { text: 'At the end, copy your results and send them to the email.' }))),
    );
    app.appendChild(el('div', { class: 'card' },
      el('label', { for: 'demo', style: 'margin-top:0', text: 'Try typing numbers before the exam.' }),
      el('div', { class: 'answer-row' }, demoIn, el('span', { class: 'unit', text: 'm/s' })),
      demoOut,
      el('label', { for: 'demo-sym', style: 'margin-top:22px', text: 'Try typing formulas before the exam.' }),
      el('div', { class: 'answer-row' }, el('span', { class: 'unit lead-in', text: 'v =' }), symIn),
      symKeys(symIn, demoVars),
      symOut,
      el('label', { for: 'name', style: 'margin-top:22px', text: 'Your name' }), nameIn, err,
      el('div', { class: 'row', style: 'margin-top:12px' }, el('button', { class: 'primary', text: 'Begin the exam', onclick: function () {
        var name = nameIn.value.trim();
        if (!name) { err.textContent = 'Please enter your name.'; nameIn.focus(); return; }
        student.name = name; begin();
      } }))));
  }

  function begin() {
    engine = P.create();
    log = []; examStart = Date.now(); blurs = 0; examActive = true;
    nextQuestion();
  }
  function nextQuestion() {
    var item = engine.next();
    if (!item) { examActive = false; showDone(); return; }
    showQuestion(item, engine.count() + 1);
  }

  // ------------------------------------------------------------ question screen
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function showQuestion(item, number) {
    clear(app);
    cur = { item: item, start: Date.now(), done: false, timer: null, choice: null };
    var timerEl = el('span', { class: 'timer' });
    var msg = el('div', { class: 'msg', 'aria-live': 'polite' });
    function say(t, kind) { msg.className = 'msg' + (kind ? ' ' + kind : ''); msg.textContent = t || ''; }
    var body, getTyped;

    if (item.type === 'mc') {
      var order = shuffle(item.opts.map(function (o, i) { return i; }));
      var btns = [];
      body = el('div', { class: 'opts', role: 'group', 'aria-label': 'Answer choices' }, order.map(function (idx, k) {
        var b = el('button', { type: 'button', class: 'opt', 'aria-pressed': 'false', onclick: function () {
          cur.choice = idx; btns.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); say('');
        } }, el('span', { class: 'key', text: 'ABCD'[k] }), el('span', { text: item.opts[idx] }));
        btns.push(b); return b;
      }));
      getTyped = function () { return cur.choice === null ? '' : item.opts[cur.choice]; };
    } else {
      var isUnit = item.type === 'unit', isSym = item.type === 'sym' || isUnit;
      var input = el('input', { type: 'text', id: 'ans', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
        'aria-label': isSym ? 'Your answer for ' + item.lhs : 'Your answer' + (item.unit ? ' in ' + item.unit : '') });
      var pv = el('div', { class: 'preview', 'aria-live': 'polite' });
      var show = isSym ? function () { previewSym(pv, input.value, item.vars, isUnit); } : function () { preview(pv, input.value); };
      input.addEventListener('input', function () { say(''); show(); });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      ['paste', 'drop'].forEach(function (ev) { input.addEventListener(ev, function (e) { e.preventDefault(); say('Pasting is turned off. Please type your answer.', 'warn'); }); });
      var row = isSym
        ? el('div', { class: 'answer-row' }, el('span', { class: 'unit lead-in', text: item.lhs + ' =' }), input)
        : el('div', { class: 'answer-row' }, input, item.unit ? el('span', { class: 'unit', text: item.unit }) : null);
      var hint = isUnit ? 'Type the units, for example kg m/s^2. Letters next to each other are multiplied.' : (isSym ? typingHint(item.vars) : '');
      body = el('div', null, isSym ? el('p', { class: 'hint', text: hint }) : null, row,
        isSym ? symKeys(input, isUnit ? item.keys : item.vars, isUnit) : null, pv);
      show();
      getTyped = function () { return input.value.trim(); };
      cur.input = input;
    }

    function submit() {
      if (cur.done) { return; }
      if (item.type === 'mc') {
        if (cur.choice === null) { say('Choose an answer first, or press "I don\'t know".', 'err'); return; }
        return finish(cur.choice === 0 ? 'correct' : 'wrong', getTyped(), {});
      }
      var res = P.grade(item, getTyped());
      if (res.status === 'invalid') { say(res.message, 'err'); cur.input.focus(); return; }
      finish(res.status, getTyped(), res.tag ? { tag: res.tag } : {});
    }

    app.appendChild(el('div', { class: 'card' },
      el('div', { class: 'qhead' }, el('span', { class: 'where', text: 'Question ' + number + ' · ' + item.ch + '. ' + chTitle[item.ch] }), timerEl),
      el('div', { class: 'prompt' }, el('p', { text: item.q })),
      body, msg,
      el('div', { class: 'row spread' },
        el('button', { class: 'primary', text: 'Submit', onclick: submit }),
        el('button', { class: 'quiet', text: "I don't know", onclick: function () { finish('skip', '', {}); } }))));
    if (cur.input) { cur.input.focus(); }

    var tick = function () {
      var left = LIMIT - Math.floor((Date.now() - cur.start) / 1000);
      timerEl.textContent = clock(Math.max(left, 0));
      timerEl.className = 'timer' + (left <= 20 ? ' low' : '');
      if (left <= 0 && !cur.done) {
        var typed = getTyped();
        var ok = item.type === 'mc' ? cur.choice === 0 : (typed && P.grade(item, typed).status === 'correct');
        finish(ok ? 'correct' : 'skip', typed, { timedOut: true });
      }
    };
    cur.timer = setInterval(tick, 250); tick();
  }

  function finish(outcome, value, extra) {
    if (cur.done) { return; }
    cur.done = true;
    clearInterval(cur.timer);
    var seconds = Math.round((Date.now() - cur.start) / 1000);
    var rec = { id: cur.item.id, ch: cur.item.ch, rung: cur.item.rung, type: cur.item.type, answer: String(value || ''), outcome: outcome,
                seconds: seconds, timedOut: !!extra.timedOut, tag: extra.tag || null };
    engine.record(outcome, { seconds: seconds, timedOut: rec.timedOut, tag: rec.tag });
    log.push(rec);
    nextQuestion();
  }

  // ------------------------------------------------------------ student end screen: just the results JSON
  var RCODE = { pass: 'p', fail: 'f', assumed: 'a', numonly: 'n', none: '-' };
  var RNAME = { p: 'pass', f: 'fail', a: 'assumed', n: 'numonly', '-': 'none' };
  var OCODE = { correct: 'c', wrong: 'w', skip: 's' };

  function resultData(sum) {
    var tags = {};
    sum.tags.forEach(function (t) { tags[t.key] = t.count; });
    return {
      exam: 'PHYS-ALG-DIAG', version: 4, id: P.makeId(Date.now()), name: student.name,
      date: new Date().toISOString().replace(/\.\d+Z$/, 'Z'),
      seconds: Math.round((Date.now() - examStart) / 1000), switches: blurs,
      band: sum.band.name, avg: Math.round(sum.mean * 100) / 100,
      topics: sum.chapters.map(function (c) { return [c.level, c.rungs.map(function (r) { return RCODE[r]; }).join('')]; }),
      sym: [sum.symbolic.right, sum.symbolic.asked], tags: tags,
      log: log.map(function (r) {
        var row = [r.id, r.timedOut ? 't' : OCODE[r.outcome], r.seconds, r.answer];
        if (r.tag) { row.push(r.tag); }
        return row;
      })
    };
  }

  function showDone() {
    clear(app);
    var json = JSON.stringify(resultData(engine.summary()));
    var e = encodeURIComponent;
    var gmail = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + e(S.email_to) + '&su=' + e(S.subject_tag + ' ' + student.name) + '&body=' + e(json);
    var box = el('textarea', { class: 'copybox', readonly: 'readonly', 'aria-label': 'Your results' });
    box.value = json;
    var copied = el('span', { class: 'small', 'aria-live': 'polite' });
    var fallback = el('p', { class: 'small', hidden: 'hidden', 'aria-live': 'polite', text: 'Didn\'t work? Send it to ' + S.email_to });
    app.appendChild(el('div', { class: 'card' },
      el('p', { class: 'eyebrow', text: 'Finished' }),
      el('h1', { text: 'Send your results' }),
      el('p', { text: 'Copy the text below and send it to Ken, or press Email Ken.' }),
      box,
      el('div', { class: 'row', style: 'margin-top:10px' },
        el('button', { class: 'primary', text: 'Copy', onclick: function () {
          box.focus(); box.select();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(json).then(function () { copied.textContent = 'Copied.'; }, function () { copied.textContent = 'Press Ctrl+C (or Cmd+C) to copy.'; });
          } else { copied.textContent = 'Press Ctrl+C (or Cmd+C) to copy.'; }
        } }),
        el('a', { class: 'btn', href: gmail, target: '_blank', rel: 'noopener', text: 'Email Ken', onclick: function () { fallback.hidden = false; } }),
        copied),
      fallback));
    window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------ teacher view (#report): paste a student's JSON
  var MARK = { pass: '✓', fail: '✗', assumed: '(✓)', numonly: '✓*', none: '·' };
  function ladder(c) { return c.rungs.map(function (r, i) { return (i + 1) + MARK[r]; }).join(' '); }
  var LEGEND = 'Levels: 1 recall, 2 one-step, 3 multi-step, 4 challenge. ✓ right, ✗ missed, (✓) assumed from a harder right answer, ✓* right with numbers after missing the letters version, · not asked.';

  function fromData(d) {
    var band = P.BANDS.filter(function (b) { return b.name === d.band; })[0] || P.BANDS[0];
    var chapters = P.CHAPTERS.map(function (c, i) {
      var t = (d.topics || [])[i] || [null, '----'];
      var s = t[0] === null ? { key: 'nt', label: 'Not tested', plan: 'Not reached (question limit): learn this topic from the start' } : P.STATUS[t[0]];
      var numOnly = t[1].indexOf('n') >= 0;
      return { n: c[0], title: c[1], level: t[0], key: s.key, label: s.label, numOnly: numOnly,
               plan: s.plan + (numOnly ? '. Also practise solving its formulas in letters before putting numbers in.' : ''),
               rungs: t[1].split('').map(function (ch) { return RNAME[ch] || 'none'; }) };
    });
    var tags = Object.keys(d.tags || {}).filter(function (k) { return P.TAGS[k]; })
      .map(function (k) { return { key: k, name: P.TAGS[k].name, say: P.TAGS[k].say, count: d.tags[k] }; })
      .sort(function (x, y) { return y.count - x.count; });
    var sym = d.sym || [0, 0];
    return { band: band, bandIndex: P.BANDS.indexOf(band), mean: d.avg, chapters: chapters, tags: tags,
             symbolic: { right: sym[0], asked: sym[1], numOnly: chapters.filter(function (c) { return c.numOnly; }).map(function (c) { return c.n; }) } };
  }

  function findings(sum) {
    var out = [], sy = sum.symbolic;
    if (sy.asked) {
      var line = sy.right + ' of ' + sy.asked + ' letter (formula) questions right.';
      if (sy.numOnly.length) {
        out.push({ head: 'Letters vs numbers', text: line + ' Solved with numbers but not letters in: ' +
          sy.numOnly.map(function (n) { return chTitle[n]; }).join(', ') + '. The gap is rearranging formulas, not the physics.' });
      } else if (sy.right < sy.asked) {
        out.push({ head: 'Letters vs numbers', text: line + ' Each missed letters question was missed with numbers too, so the gap is the physics itself.' });
      } else {
        out.push({ head: 'Letters vs numbers', text: line + ' Formulas in letters are a strength.' });
      }
    }
    sum.tags.forEach(function (t) { out.push({ head: t.name + ' (' + t.count + '×)', text: t.say }); });
    if (!sum.tags.length) { out.push({ head: 'Slip patterns', text: 'No wrong answer matched a common slip (sign, power of ten, factor of 2, squares, upside-down fraction).' }); }
    return out;
  }

  function keyNode(item) {
    if (item.type === 'mc') { return el('span', { text: item.opts[0] }); }
    if (item.type === 'num') { return el('span', { class: 'mono', text: P.fmt(item.ans) + (item.unit ? ' ' + item.unit : '') }); }
    return mathNode(P.parseExpr(item.key, item.vars).ast, item.type === 'unit');
  }

  function showViewer() {
    clear(app);
    var input = el('textarea', { class: 'copybox', id: 'paste', 'aria-label': 'Student results JSON', placeholder: '{"exam":"PHYS-ALG-DIAG", ...}' });
    var err = el('div', { class: 'msg err' });
    var out = el('div');
    app.appendChild(el('div', { class: 'card' },
      el('p', { class: 'eyebrow', text: 'Teacher view' }),
      el('h1', { text: 'Read a result' }),
      el('label', { for: 'paste', text: 'Paste the student\'s results' }), input, err,
      el('div', { class: 'row' }, el('button', { class: 'primary', text: 'Show report', onclick: function () {
        var raw = input.value, a = raw.indexOf('{'), b = raw.lastIndexOf('}'), d = null;
        try { d = JSON.parse(raw.slice(a, b + 1)); } catch (e) { d = null; }
        if (!d || d.exam !== 'PHYS-ALG-DIAG') { err.textContent = 'That does not look like results from this exam.'; return; }
        err.textContent = ''; clear(out); out.appendChild(renderReport(d));
      } }))));
    app.appendChild(out);
  }

  function renderReport(d) {
    var sum = fromData(d);
    var meter = el('div', { class: 'meter' }, P.BANDS.map(function (b, i) { return el('span', { class: i <= sum.bandIndex ? 'on' : '' }); }));
    var meterLabels = el('div', { class: 'meter-labels' }, P.BANDS.map(function (b) { return el('span', { text: b.name }); }));
    var rows = sum.chapters.map(function (c) {
      return el('tr', null, el('td', { class: 'num', text: String(c.n) }), el('td', { text: c.title }),
        el('td', null, chip(c.key, c.label)), el('td', { text: c.plan }), el('td', { class: 'ladder small', text: ladder(c) }));
    });
    var RES = { c: ['right', 'Right'], w: ['wrong', 'Missed'], s: ['skipped', 'Skipped'], t: ['skipped', 'Timed out'] };
    var logRows = (d.log || []).map(function (r, i) {
      var item = byId[r[0]];
      if (!item) { return el('tr', null, el('td', { class: 'num', text: String(i + 1) }), el('td', { colspan: '6', text: 'Unknown question ' + r[0] })); }
      var res = RES[r[1]] || RES.s;
      return el('tr', null, el('td', { class: 'num', text: String(i + 1) }),
        el('td', { class: 'small', text: item.id + (item.type === 'sym' ? ' (letters)' : item.type === 'unit' ? ' (units)' : '') }),
        el('td', { text: item.q }), el('td', { class: 'mono', text: r[3] || '—' }), el('td', null, keyNode(item)),
        el('td', null, chip(res[0], res[1]), r[4] && P.TAGS[r[4]] ? el('div', { style: 'margin-top:4px' }, chip('tag', P.TAGS[r[4]].name)) : null),
        el('td', { class: 'small num', text: r[2] + 's' }));
    });
    return el('div', { class: 'card' },
      el('p', { class: 'eyebrow', text: (d.date || '').replace('T', ' ').replace('Z', ' UTC') + ' · id ' + d.id }),
      el('h1', { text: d.name || '(no name)' }),
      el('p', { class: 'small', text: 'Time ' + clock(d.seconds || 0) + ' · ' + (d.log || []).length + ' questions · ' + (d.switches || 0) + ' window switches' }),
      el('div', { class: 'band' },
        el('span', { class: 'small', text: 'Overall level · average ' + (+d.avg).toFixed(2) + ' of 4' }),
        el('span', { class: 'name', text: sum.band.name }),
        el('span', { text: sum.band.say }), meter, meterLabels),
      el('h2', { text: 'What to work on' }),
      el('ul', { class: 'findings' }, findings(sum).map(function (f) { return el('li', null, el('b', { text: f.head }), f.text); })),
      el('h2', { text: 'Topics' }),
      el('p', { class: 'small', text: LEGEND }),
      el('div', { class: 'tablewrap' }, el('table', null,
        el('tr', null, ['#', 'Topic', 'Result', 'What to do', 'Levels'].map(function (h) { return el('th', { text: h }); })), rows)),
      el('h2', { text: 'Answers' }),
      el('div', { class: 'tablewrap' }, el('table', null,
        el('tr', null, ['#', 'Item', 'Question', 'Typed', 'Correct', 'Result', 'Time'].map(function (h) { return el('th', { text: h }); })), logRows)));
  }

  if (location.hash === '#report') { showViewer(); } else { showStart(); }
  window.addEventListener('hashchange', function () { if (location.hash === '#report' && !examActive) { showViewer(); } });
